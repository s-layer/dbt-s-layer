name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Install prek
        run: uv tool install prek

      - name: Run quality gates
        run: prek run --all-files

      - name: Tests
        # The DuckDB execution tests may not skip for want of the semantic_views extension.
        env:
          DBT_S_LAYER_DUCKDB_EXTENSION: required
        run: uv run pytest

      # The lockfile's duckdb loads extension 0.16; these load 0.13 (the floor for dbt Core)
      # and 0.11 (the one dbt Fusion's embedded DuckDB 1.5.4 gets).
      - name: Generated DuckDB views on older extensions
        if: matrix.python-version == '3.12'
        env:
          DBT_S_LAYER_DUCKDB_EXTENSION: required
        run: |
          DBT_S_LAYER_DUCKDB_VERSION=1.5.6 uv run --with duckdb==1.5.6 python -m pytest tests/test_duckdb_execute.py
          DBT_S_LAYER_DUCKDB_VERSION=1.5.4 uv run --with duckdb==1.5.4 python -m pytest tests/test_duckdb_execute.py

      - name: Cache pruning
        if: always()
        run: uv cache prune --ci
