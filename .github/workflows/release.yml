name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]*"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]*"
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish (a dry run goes to TestPyPI)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Build wheel and sdist
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  validate:
    name: Validate distributions
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Test wheel installation
        run: |
          uv venv --python ${{ matrix.python-version }} test-env-wheel
          uv pip install --python test-env-wheel/bin/python dist/*.whl
          test-env-wheel/bin/python -c "import dbt_s_layer; print('Wheel installation OK')"
          test-env-wheel/bin/dbt-s-layer --version
          test-env-wheel/bin/dbt-s-layer --help

      - name: Test sdist installation
        run: |
          uv venv --python ${{ matrix.python-version }} test-env-sdist
          uv pip install --python test-env-sdist/bin/python dist/*.tar.gz
          test-env-sdist/bin/python -c "import dbt_s_layer; print('Sdist installation OK')"

      - name: Check py.typed marker in wheel
        run: |
          unzip -l dist/*.whl | grep "dbt_s_layer/py.typed" || (echo "ERROR: py.typed marker missing" && exit 1)

  publish:
    name: Publish to ${{ inputs.repository == 'testpypi' && 'TestPyPI' || 'PyPI' }}
    needs: [quality, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A tag push publishes to PyPI; a manual run defaults to TestPyPI.
    environment:
      name: ${{ inputs.repository == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/p/dbt-s-layer' || 'https://pypi.org/p/dbt-s-layer' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # TestPyPI keeps a version forever, so a repeat rehearsal skips files already there.
          skip-existing: ${{ inputs.repository == 'testpypi' }}

  github-release:
    name: Create GitHub Release
    needs: [publish]
    # Only a tag push releases: a manual run started on a tag must not create one.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
