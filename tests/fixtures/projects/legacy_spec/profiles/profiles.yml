# Parse-only profiles: `dbt parse` never connects, so the credentials are dummies.
# Fusion uses the `snowflake` target, dbt Core the `duckdb` one.
fx:
  target: duckdb
  outputs:
    snowflake:
      type: snowflake
      account: dummy
      user: dummy
      password: dummy
      role: dummy
      database: ANALYTICS
      warehouse: WH
      schema: MARTS
    duckdb:
      type: duckdb
      path: ":memory:"
      schema: marts
