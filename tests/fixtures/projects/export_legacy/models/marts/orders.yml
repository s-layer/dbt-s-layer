semantic_models:
  - name: orders
    model: ref('orders')
    defaults:
      agg_time_dimension: ordered_at
    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: store
        type: foreign
        expr: store_id
    dimensions:
      - name: status
        type: categorical
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: order_total
        agg: sum
        expr: amount
metrics:
  - name: revenue
    type: simple
    label: Revenue
    type_params:
      measure: order_total
  - name: revenue_cumulative
    type: cumulative
    type_params:
      measure: order_total
saved_queries:
  - name: revenue_by_day
    query_params:
      metrics: [revenue]
      group_by: ["TimeDimension('order__ordered_at', 'day')"]
    exports:
      - name: exp_revenue_by_day
        config:
          export_as: table
      - name: exp_revenue_by_day_view
        config:
          export_as: view
          alias: revenue_daily
          schema: reporting
  - name: revenue_by_region_country
    query_params:
      metrics: [revenue]
      group_by: ["Dimension('store__region')", "Dimension('customer__country')"]
      where: ["{{ Dimension('order__status') }} = 'paid'"]
    exports:
      - name: exp_region_country
        config:
          export_as: table
  - name: items_by_country
    config:
      schema: sq_schema
      export_as: view
    query_params:
      metrics: [items_sold]
      group_by: ["Dimension('customer__country', entity_path=['order'])"]
    exports:
      - name: exp_items_by_country
  - name: cumulative_revenue
    query_params:
      metrics: [revenue_cumulative]
      group_by: ["TimeDimension('metric_time', 'day')"]
    exports:
      - name: exp_cumulative
        config:
          export_as: table
