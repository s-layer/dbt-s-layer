# The dbt Core twin of databricks_spec (legacy YAML spec): snowflake_legacy plus an
# approximate discrete percentile, which Databricks supports and Snowflake does not.
semantic_models:
  - name: orders
    description: "One row per order. It's the 'fact' table."
    model: ref('orders')
    defaults:
      agg_time_dimension: ordered_at
    entities:
      - name: order
        type: primary
        expr: order_id
        config:
          meta:
            s_layer:
              value: {kind: identifier}
      - name: customer
        type: foreign
        expr: customer_id
      - name: store
        type: foreign
        expr: store_id
    dimensions:
      - name: status
        type: categorical
        config:
          meta:
            s_layer:
              value: {kind: category}
              synonyms: [order status]
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
        config:
          meta:
            s_layer:
              value: {kind: date}
    measures:
      - name: order_total
        agg: sum
        expr: amount
      - name: distinct_orders
        agg: count_distinct
        expr: order_id
      - name: amount_p90
        agg: percentile
        expr: amount
        agg_params:
          percentile: 0.9
          use_discrete_percentile: true
      - name: amount_p50_approx
        agg: percentile
        expr: amount
        agg_params:
          percentile: 0.5
          use_discrete_percentile: true
          use_approximate_percentile: true
      - name: latest_amount
        agg: sum
        expr: amount
        non_additive_dimension:
          name: ordered_at
          window_choice: max
metrics:
  - name: revenue
    type: simple
    label: Revenue
    type_params:
      measure: order_total
    config:
      meta:
        s_layer:
          value: {kind: currency, currency: USD}
          display: {decimals: {max: 0}}
          synonyms: [sales, turnover]
  - name: revenue_cumulative
    type: cumulative
    type_params:
      measure: order_total
  - name: order_count
    type: simple
    description: Distinct orders.
    label: Orders
    type_params:
      measure: distinct_orders
  - name: revenue_p90
    type: simple
    label: Revenue p90
    type_params:
      measure: amount_p90
  - name: revenue_p50_approx
    type: simple
    type_params:
      measure: amount_p50_approx
  - name: latest_revenue
    type: simple
    label: Latest revenue
    type_params:
      measure: latest_amount
  - name: average_order_value
    type: ratio
    label: AOV
    type_params:
      numerator: revenue
      denominator: order_count
    config:
      meta:
        s_layer:
          value: {kind: currency, currency: USD}
  - name: revenue_doubled
    type: derived
    label: Revenue x2
    type_params:
      expr: rev * 2
      metrics:
        - name: revenue
          alias: rev
  - name: revenue_per_item
    type: derived
    label: Revenue per item
    type_params:
      expr: revenue / items_sold
      metrics:
        - name: revenue
        - name: items_sold
saved_queries:
  - name: revenue_by_day
    query_params:
      metrics: [revenue]
      group_by: ["TimeDimension('order__ordered_at', 'day')"]
    exports:
      - name: exp_revenue_by_day
        config:
          export_as: table
      - name: exp_revenue_by_day_view
        config:
          export_as: view
          alias: revenue_daily
          schema: reporting
  - name: revenue_by_region_country
    query_params:
      metrics: [revenue]
      group_by: ["Dimension('store__region')", "Dimension('customer__country')"]
      where: ["{{ Dimension('order__status') }} = 'paid'"]
    exports:
      - name: exp_region_country
        config:
          export_as: table
  - name: items_by_country
    config:
      schema: sq_schema
      export_as: view
    query_params:
      metrics: [items_sold]
      group_by: ["Dimension('customer__country', entity_path=['order'])"]
    exports:
      - name: exp_items_by_country
  - name: cumulative_revenue
    query_params:
      metrics: [revenue_cumulative]
      group_by: ["TimeDimension('metric_time', 'day')"]
    exports:
      - name: exp_cumulative
        config:
          export_as: table
