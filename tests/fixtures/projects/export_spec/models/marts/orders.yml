models:
  - name: orders
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    columns:
      - name: order_id
        entity:
          type: primary
          name: order
      - name: customer_id
        entity:
          type: foreign
          name: customer
      - name: store_id
        entity:
          type: foreign
          name: store
      - name: status
        dimension:
          type: categorical
      - name: ordered_at
        granularity: day
        dimension:
          type: time
    metrics:
      - name: revenue
        type: simple
        label: Revenue
        agg: sum
        expr: amount
      - name: revenue_cumulative
        type: cumulative
        input_metric: revenue
saved_queries:
  - name: revenue_by_day
    query_params:
      metrics: [revenue]
      group_by: ["TimeDimension('order__ordered_at', 'day')"]
    exports:
      - name: exp_revenue_by_day
        config:
          export_as: table
      - name: exp_revenue_by_day_view
        config:
          export_as: view
          alias: revenue_daily
          schema: reporting
  - name: revenue_by_region_country
    query_params:
      metrics: [revenue]
      group_by: ["Dimension('store__region')", "Dimension('customer__country')"]
      where: ["{{ Dimension('order__status') }} = 'paid'"]
    exports:
      - name: exp_region_country
        config:
          export_as: table
  - name: items_by_country
    config:
      schema: sq_schema
      export_as: view
    query_params:
      metrics: [items_sold]
      group_by: ["Dimension('customer__country', entity_path=['order'])"]
    exports:
      - name: exp_items_by_country
  - name: cumulative_revenue
    query_params:
      metrics: [revenue_cumulative]
      group_by: ["TimeDimension('metric_time', 'day')"]
    exports:
      - name: exp_cumulative
        config:
          export_as: table
