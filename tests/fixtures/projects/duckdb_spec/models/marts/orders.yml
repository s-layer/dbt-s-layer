# The DuckDB fixture (Fusion; duckdb_legacy is its dbt Core twin): the Databricks fixture plus
# an expression dimension and metric, whose columns the generator qualifies (order_items has an
# ordered_at too).
models:
  - name: orders
    description: "One row per order. It's the 'fact' table."
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    columns:
      - name: order_id
        entity:
          type: primary
          name: order
          config:
            meta:
              s_layer:
                value: {kind: identifier}
      - name: customer_id
        entity:
          type: foreign
          name: customer
      - name: store_id
        entity:
          type: foreign
          name: store
      - name: status
        # S-LAYER blocks: on the column for status, on the dimension for ordered_at.
        config:
          meta:
            s_layer:
              value: {kind: category}
              synonyms: [order status]
        dimension:
          type: categorical
      - name: ordered_at
        granularity: day
        dimension:
          type: time
          config:
            meta:
              s_layer:
                value: {kind: date}
    derived_semantics:
      dimensions:
        - name: order_month
          type: categorical
          expr: date_trunc('month', ordered_at)
    metrics:
      - name: paid_revenue
        type: simple
        agg: sum
        expr: CASE WHEN status = 'paid' THEN amount ELSE 0 END
      - name: revenue
        type: simple
        label: Revenue
        agg: sum
        expr: amount
        config:
          meta:
            s_layer:
              value: {kind: currency, currency: USD}
              display: {decimals: {max: 0}}
              synonyms: [sales, turnover]
      - name: revenue_cumulative
        type: cumulative
        input_metric: revenue
      - name: order_count
        type: simple
        description: Distinct orders.
        agg: count_distinct
        expr: order_id
      - name: revenue_p90
        type: simple
        agg: percentile
        percentile: 0.9
        percentile_type: discrete
        expr: amount
      - name: latest_revenue
        type: simple
        agg: sum
        expr: amount
        non_additive_dimension:
          name: ordered_at
          window_agg: max
      - name: average_order_value
        type: ratio
        numerator: revenue
        denominator: order_count
        config:
          meta:
            s_layer:
              value: {kind: currency, currency: USD}
      - name: revenue_doubled
        type: derived
        expr: rev * 2
        input_metrics:
          - name: revenue
            alias: rev
      - name: revenue_per_item
        type: derived
        expr: revenue / items_sold
        input_metrics:
          - name: revenue
          - name: items_sold
saved_queries:
  - name: revenue_by_day
    query_params:
      metrics: [revenue]
      group_by: ["TimeDimension('order__ordered_at', 'day')"]
    exports:
      - name: exp_revenue_by_day
        config:
          export_as: table
      - name: exp_revenue_by_day_view
        config:
          export_as: view
          alias: revenue_daily
          schema: reporting
  - name: revenue_by_region_country
    query_params:
      metrics: [revenue]
      group_by: ["Dimension('store__region')", "Dimension('customer__country')"]
      where: ["{{ Dimension('order__status') }} = 'paid'"]
    exports:
      - name: exp_region_country
        config:
          export_as: table
  - name: items_by_country
    config:
      schema: sq_schema
      export_as: view
    query_params:
      metrics: [items_sold]
      group_by: ["Dimension('customer__country', entity_path=['order'])"]
    exports:
      - name: exp_items_by_country
  - name: cumulative_revenue
    query_params:
      metrics: [revenue_cumulative]
      group_by: ["TimeDimension('metric_time', 'day')"]
    exports:
      - name: exp_cumulative
        config:
          export_as: table
