[project]
name = "dbt-s-layer"
version = "0.1.0"
description = "dbt Cloud semantic-layer features for dbt Core / Fusion users"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "paul", email = "ego@anentropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.1",
    "pydantic>=2.7,<3",
    # Pinned by spike (see spike/results-2026-04-21.txt). Bumping any of the
    # pins below requires re-running `uv run python spike/verify_stack.py` and
    # updating the results file.
    #
    # NOTE on metricflow-semantics: as of metricflow 0.209.0 it is shipped as
    # a namespace INSIDE the `metricflow` wheel (site-packages/metricflow_semantics/)
    # and NOT as a separate PyPI distribution. `uv add metricflow-semantics`
    # fails with "not found in the package registry". We therefore do not pin
    # it directly — its version tracks `metricflow` exactly. If metricflow
    # later splits the namespace into its own dist, add: metricflow-semantics==X.Y.Z
    "metricflow==0.209.0",
    # metricflow-semantics==bundled-in-metricflow-0.209.0 (see NOTE above — no standalone dist)
    "dbt-semantic-interfaces==0.9.4.dev0",
]

[project.scripts]
dbt-s-layer = "dbt_s_layer.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.1",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportPrivateUsage = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "D"]
ignore = [
    "D1",    # don't require docstrings everywhere
    "D202",  # allow blank line after docstring
    "D203",  # conflicts with D211
    "D212",  # conflicts with D213 (multiline summary on second line)
    "D401",  # imperative mood awkward for dunder methods
    "D413",  # blank line after last section not required
]

[tool.pytest.ini_options]
addopts = "-v"

[tool.uv]
# metricflow 0.209.0 caps at Requires-Python <3.13. This override widens the cap
# so our Python 3.13 and 3.14 CI legs can resolve metricflow. The upper bound is
# <3.15 (not <3.14) because `python_version < "3.14"` evaluates False on Python
# 3.14 itself — `<3.15` is the inclusive-of-3.14 form. Remove once metricflow
# publishes a release that drops the <3.13 cap natively.
override-dependencies = [
    "metricflow; python_version >= '3.10' and python_version < '3.15'",
]
# Allow the dev-version transitive pin (dbt-semantic-interfaces==0.9.4.dev0).
# metricflow 0.209.0 pins this exactly; uv refuses dev versions by default.
prerelease = "allow"
