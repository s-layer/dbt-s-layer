[project]
name = "dbt-s-layer"
version = "0.1.0"
description = "dbt Cloud semantic-layer features for dbt Core / Fusion users"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "paul", email = "ego@anentropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.1",
    "pydantic>=2.7,<3",
    # Pinned by spike (see spike/results-2026-10-19.txt). Bumping this pin
    # requires re-running `uv run python spike/verify_stack.py`, updating the
    # results file, and keeping tests/test_stack_surface.py green.
    #
    # As of metricflow 0.213.0 the wheel bundles both `metricflow_semantics`
    # and `metricflow_semantic_interfaces` (its own fork of
    # dbt-semantic-interfaces) and no longer depends on the
    # `dbt-semantic-interfaces` distribution. Neither bundled namespace is a
    # separate PyPI dist, so this single pin fixes all three.
    "metricflow==0.213.0",
]

[project.scripts]
dbt-s-layer = "dbt_s_layer.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.1",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportPrivateUsage = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "D"]
ignore = [
    "D1",    # don't require docstrings everywhere
    "D202",  # allow blank line after docstring
    "D203",  # conflicts with D211
    "D212",  # conflicts with D213 (multiline summary on second line)
    "D401",  # imperative mood awkward for dunder methods
    "D413",  # blank line after last section not required
]

[tool.pytest.ini_options]
addopts = "-v"
